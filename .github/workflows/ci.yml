name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Lint & Test (Backend)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bus_aggregator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bus_aggregator"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bus_aggregator
      JWT_ACCESS_SECRET: ci_secret_access
      JWT_REFRESH_SECRET: ci_secret_refresh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Static code check (lint)
        run: npm run lint

      - name: Run automated tests
        run: npm test

  frontend:
    name: Build (Frontend)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
